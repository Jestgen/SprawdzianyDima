<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lista zakupów</title>
  <link rel="stylesheet" href="public/main.css" />
</head>
<body>
  <h1>Lista zakupów</h1>

  <div class="form-section">
    <input type="text" id="nameInput" placeholder="Nazwa produktu" />
    <input type="number" id="quantityInput" placeholder="Ilość" min="1" />
    <button id="addButton">Dodaj produkt</button>
  </div>

  <p id="errorMessage"></p>

  <div class="filter-section">
    <label for="filterSelect">Pokaz</label>
    <select id="filterSelect">
      <option value="all">Wszystkie</option>
      <option value="toBuy">Do kupienia</option>
      <option value="bought">Kupione</option>
    </select>
  </div>

  <p id="counter">Do kupienia</p>

  <div id="listContainer"></div>

  <button id="clearBoughtButton">Usuń kupione</button>

  <script src="public/main.js"></script>
</body>
</html>
